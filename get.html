<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Hisab</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b6b2e;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;text-align:center;padding:24px}
  h1{margin:0 0 6px;font-size:28px}
  p{margin:0 0 20px;opacity:.9}
  a{display:inline-block;background:#fff;color:#0b6b2e;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;margin:6px}
</style>
</head>
<body>
<div>
  <h1>Daily Hisab</h1>
  <p>Your Money. Your Control.</p>
  <p id="msg">Opening...</p>
  <a id="web" href="https://samirjanikhan2233-ctrl.github.io/Daily-hisab/">Open Daily Hisab</a>
  <a id="play" href="#" style="display:none">Get it on Google Play</a>
</div>
<script>
  // Jab app Play Store par live ho jaye, sirf neeche wali line mein apna Play Store link daal dein.
  // Misal: "https://play.google.com/store/apps/details?id=com.example.dailyhisab"
  var PLAY_STORE_URL = "";
  var WEB_URL = "https://samirjanikhan2233-ctrl.github.io/Daily-hisab/";

  var isAndroid = /android/i.test(navigator.userAgent);
  var play = document.getElementById("play");

  if (PLAY_STORE_URL) {
    play.href = PLAY_STORE_URL;
    if (isAndroid) play.style.display = "inline-block";
  }

  var target = (isAndroid && PLAY_STORE_URL) ? PLAY_STORE_URL : WEB_URL;
  setTimeout(function () { window.location.replace(target); }, 400);
</script>
</body>
</html>
